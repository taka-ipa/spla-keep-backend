server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    # レスポンスヘッダにnginxのバージョンを出さない
    server_tokens off;

    # このAPIにファイルアップロードはないので、リクエストボディは小さく制限する
    client_max_body_size 1m;

    # 外に出すのはAPI(/api/...)とヘルスチェック(/up)だけ。それ以外のURLはPHPに渡さず404にする
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass backend:9000;

        # 常にLaravelの入口(index.php)を実行する。nginx側にPHPファイルは置かない
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # PHPのバージョンを示すX-Powered-Byヘッダを外に出さない
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
